name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.4.0)'
        required: true

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # PRE-DEPLOY CHECKS
  # ===========================================================================
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"
      
      - name: Security audit
        run: npm audit --audit-level=critical
        continue-on-error: false

  # ===========================================================================
  # BUILD & DEPLOY
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: production
      url: https://www.ziffir.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_VERSION: ${{ needs.preflight.outputs.version }}
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      
      - name: Deploy to S3 + CloudFront
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_PROD }} --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_PROD }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_PROD }} \
            --paths "/*"
      
      - name: Smoke tests on production
        run: |
          curl -f https://www.ziffir.com/ || exit 1
          echo "✅ Homepage OK"
      
      - name: Tag release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ needs.preflight.outputs.version }}
          git push origin ${{ needs.preflight.outputs.version }}
      
      - name: Notify team on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_PROD }}
          payload: |
            {
              "text": "✅ *Production deploy réussi!* Version: `${{ needs.preflight.outputs.version }}`\n📦 Commit: `${{ github.sha }}`\n👤 Par: ${{ github.actor }}"
            }
      
      - name: Notify team on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_PROD }}
          payload: |
            {
              "text": "🚨 *ÉCHEC deploy production!* Version: `${{ needs.preflight.outputs.version }}`\nAction: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
